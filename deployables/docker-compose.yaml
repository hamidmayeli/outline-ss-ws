services:
  outline-server:
    image: hamidmayeli/outline-over-ws:latest
    container_name: outline-server
    restart: always
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9091/metrics >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./outline/config/config.yaml:/etc/outline/config.yaml:ro
      - ./prometheus:/var/lib/prometheus

  management-app:
    image: hamidmayeli/outline-manager:latest
    container_name: management-app
    restart: always
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - Jwt__SecretKey=${JWT_SECRET}
      - AppSettings__Domain=${DOMAIN}
      - AppSettings__TcpPath=${TCP_PATH}
      - AppSettings__UdpPath=${UDP_PATH}
      - AppSettings__OutlineConfigPath=/etc/outline/config.yaml
      - AppSettings__PrometheusUrl=http://outline-server:9092
      - DataDirectory=/app/data
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__OutlineManager.API=Trace
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
      - Logging__LogLevel__System.Net.Http.HttpClient.IMetricsService=Warning
    volumes:
      - ./data:/app/data
      - ./outline/config/config.yaml:/etc/outline/config.yaml

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    environment:
      - DOMAIN=${DOMAIN}
      - TCP_PATH=${TCP_PATH}
      - UDP_PATH=${UDP_PATH}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-webroot:/var/www/certbot:ro
    depends_on:
      outline-server:
        condition: service_healthy
      management-app:
        condition: service_healthy

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
