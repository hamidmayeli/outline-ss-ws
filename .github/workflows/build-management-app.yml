name: Build and Push Management App

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - 'management-app/**'
      - '.github/workflows/build-management-app.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'management-app/**'
      - '.github/workflows/build-management-app.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Test API
      working-directory: management-app
      run: docker build --target test-api .

    - name: Build client
      working-directory: management-app
      run: docker build --target build-client .

    - name: Setup Node.js for E2E (tag only)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: actions/setup-node@v6
      with:
        node-version: '22'

    - name: Setup pnpm for E2E (tag only)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: pnpm/action-setup@v6
      with:
        version: 10

    - name: Install E2E dependencies (tag only)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      working-directory: management-app/e2e
      run: pnpm install --frozen-lockfile

    - name: Install Playwright browsers (tag only)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      working-directory: management-app/e2e
      run: pnpm e2e:install:browsers

    - name: Run E2E tests (tag only)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      working-directory: management-app/e2e
      run: |
        pnpm e2e:up-build
        pnpm e2e:test

    - name: Teardown E2E runtime (tag only)
      if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      working-directory: management-app/e2e
      run: pnpm e2e:down

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    env:
      DOCKER_BUILDKIT: 1
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image (main)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v7
      with:
        context: ./management-app
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/outline-manager:latest

    - name: Build and push Docker image (PR)
      if: github.event_name == 'pull_request'
      uses: docker/build-push-action@v7
      with:
        context: ./management-app
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/outline-manager:pr-${{ github.event.number }}

    - name: Build and push Docker image (tag)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: docker/build-push-action@v7
      with:
        context: ./management-app
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/outline-manager:${{ github.ref_name }}
          ${{ secrets.DOCKER_USERNAME }}/outline-manager:stable
