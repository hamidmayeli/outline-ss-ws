name: Build and Push Outline SS Server

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (default: latest)'
        required: false
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOCKER_BUILDKIT: 1

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./outline
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/outline-over-ws:${{ github.event.inputs.tag }}
          ${{ secrets.DOCKER_USERNAME }}/outline-over-ws:latest
