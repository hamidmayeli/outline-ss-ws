name: Build and Push Outline SS Server

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (default: latest)'
        required: false
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # QEMU is removed because our new Dockerfile relies on true multi-arch cross-compilation
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Multi-Arch Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./outline
        platforms: linux/amd64,linux/arm64
        push: true
        # Cleaned up tags: both platforms will now exist under the exact same tag name
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/outline-over-ws:${{ github.event.inputs.tag }}
          ${{ secrets.DOCKER_USERNAME }}/outline-over-ws:latest
