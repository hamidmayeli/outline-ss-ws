version: 2
updates:
  # Enable version updates for npm (frontend)
  - package-ecosystem: "npm"
    directory: "/management-app/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      frontend-version-updates:
        patterns:
          - "*"
      frontend-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 3

  # Enable version updates for NuGet (.NET backend)
  - package-ecosystem: "nuget"
    directory: "/management-app/backend/API"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      backend-version-updates:
        patterns:
          - "*"
      backend-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Enable version updates for Docker
  - package-ecosystem: "docker"
    directory: "/management-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      management-docker-version-updates:
        patterns:
          - "*"
      management-docker-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/outline"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      outline-docker-version-updates:
        patterns:
          - "*"
      outline-docker-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-version-updates:
        patterns:
          - "*"
      actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
